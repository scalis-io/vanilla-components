cubes:
  - name: custom_requisition_stages_table
    description: 'Custom report: Table view of pipeline stages with candidate count, avg days, and interview count. Includes HIRED stage. Filterable by job label and date range (entered_at).'
    sql: >
      WITH /* All distinct pipeline stages for this company to generate consistent numbering */
      company_stages AS (
        SELECT DISTINCT
          ts."id" AS "template_stage_id",
          ts."name"::text AS "stage_name",
          ts."pipeline_rank_order" AS "stage_rank_order",
          tm."name"::text AS "milestone_name",
          tm."rank_order" AS "milestone_rank_order",
          CASE
            WHEN ts."name" IS NULL OR TRIM(ts."name"::text) = ''
              THEN INITCAP(REPLACE(tm."name"::text, '_', ' '))
            WHEN UPPER(REPLACE(ts."name"::text, '_', ' ')) = UPPER(REPLACE(tm."name"::text, '_', ' '))
              THEN INITCAP(REPLACE(ts."name"::text, '_', ' '))
            ELSE CONCAT(
              INITCAP(REPLACE(tm."name"::text, '_', ' ')),
              ' > ',
              INITCAP(REPLACE(ts."name"::text, '_', ' '))
            )
          END AS "stage_label_raw"
        FROM "template_stage" ts
        JOIN "template_milestone" tm ON tm."id" = ts."template_milestone_id"
        JOIN "template_pipeline" tp ON tp."id" = ts."template_pipeline_id"
        WHERE ts."archived" IS NOT TRUE
          AND EXISTS (
            SELECT 1
            FROM "requisition" r
            JOIN "job_listing" jl ON jl."job_requisition_id" = r."id" AND jl."is_deleted" IS NOT TRUE
            LEFT JOIN "job_listing_job_pipeline" jljp ON jljp."job_listing_id" = jl."id"
            LEFT JOIN "job_pipeline" jp ON jp."id" = jljp."job_pipeline_id"
            LEFT JOIN "job_pipeline" jp2 ON jp2."job_requisition_id" = r."id"
            WHERE r."is_deleted" IS NOT TRUE
              AND COALESCE(jp."template_pipeline_id", jp2."template_pipeline_id") = tp."id"
              {% if COMPILE_CONTEXT.securityContext.companyId %}
                AND r."company_id" = '{ COMPILE_CONTEXT.securityContext.companyId }'
              {% endif %}
          )
      ),
      /* Assign sequential numbers from the FULL set of stages */
      numbered_labels AS (
        SELECT
          cs."stage_label_raw",
          MIN(cs."milestone_rank_order" * 1000 + cs."stage_rank_order") AS "sort_order",
          CONCAT(
            ROW_NUMBER() OVER (ORDER BY MIN(cs."milestone_rank_order" * 1000 + cs."stage_rank_order")),
            '. ',
            cs."stage_label_raw"
          ) AS "stage_label"
        FROM company_stages cs
        GROUP BY cs."stage_label_raw"
      ),
      /* Pre-aggregate interviews to prevent fan-out */
      interviews_grouped AS (
        SELECT
          application_id,
          stage_id,
          COUNT(id) AS interview_count
        FROM "candidate_interview"
        WHERE "status"::text = 'INTERVIEW_SCHEDULED'
        GROUP BY 1, 2
      ),
      stage_transitions AS (
        SELECT
          "activity_log"."candidate_application_id",
          "activity_log"."new_template_stage_id" AS "template_stage_id",
          "activity_log"."activity_timestamp" AS "entered_at",
          LEAD("activity_log"."activity_timestamp") OVER (
            PARTITION BY "activity_log"."candidate_application_id"
            ORDER BY "activity_log"."activity_timestamp"
          ) AS "exited_at"
        FROM "activity_log"
        WHERE "activity_log"."user_action" = 'ADVANCE_CANDIDATE'
          AND "activity_log"."new_template_stage_id" IS NOT NULL
          AND "activity_log"."activity_timestamp" IS NOT NULL
          AND "activity_log"."is_deleted" IS NOT TRUE

        UNION ALL

        SELECT
          "activity_log"."candidate_application_id",
          "activity_log"."previous_template_stage_id" AS "template_stage_id",
          COALESCE("candidate_application"."applied_at", "candidate_application"."created_at") AS "entered_at",
          "activity_log"."activity_timestamp" AS "exited_at"
        FROM "activity_log"
        JOIN "candidate_application"
          ON "candidate_application"."id" = "activity_log"."candidate_application_id"
          AND "candidate_application"."deleted" IS NULL
        WHERE "activity_log"."user_action" = 'ADVANCE_CANDIDATE'
          AND "activity_log"."previous_template_stage_id" IS NOT NULL
          AND "activity_log"."activity_timestamp" IS NOT NULL
          AND "activity_log"."is_deleted" IS NOT TRUE
          AND NOT EXISTS (
            SELECT 1 FROM "activity_log" al2
            WHERE al2."candidate_application_id" = "activity_log"."candidate_application_id"
              AND al2."user_action" = 'ADVANCE_CANDIDATE'
              AND al2."activity_timestamp" < "activity_log"."activity_timestamp"
              AND al2."is_deleted" IS NOT TRUE
          )
      ),
      unique_transitions AS (
        SELECT DISTINCT ON (stage_transitions."candidate_application_id", stage_transitions."template_stage_id", stage_transitions."entered_at")
          stage_transitions."candidate_application_id",
          stage_transitions."template_stage_id",
          stage_transitions."entered_at",
          stage_transitions."exited_at",
          "requisition"."id" AS "requisition_id",
          "requisition"."job_name" AS "job_name",
          CONCAT("requisition"."job_name", ' (Req ID: ', "requisition"."ext_requisition_id", ')') AS "job_label",
          "requisition"."company_id" AS "company_id",
          CASE
            WHEN "template_stage"."name" IS NULL OR TRIM("template_stage"."name"::text) = ''
              THEN INITCAP(REPLACE("template_milestone"."name"::text, '_', ' '))
            WHEN UPPER(REPLACE("template_stage"."name"::text, '_', ' ')) = UPPER(REPLACE("template_milestone"."name"::text, '_', ' '))
              THEN INITCAP(REPLACE("template_stage"."name"::text, '_', ' '))
            ELSE CONCAT(
              INITCAP(REPLACE("template_milestone"."name"::text, '_', ' ')),
              ' > ',
              INITCAP(REPLACE("template_stage"."name"::text, '_', ' '))
            )
          END AS "stage_label_raw"
        FROM stage_transitions
        JOIN "candidate_application" ON "candidate_application"."id" = stage_transitions."candidate_application_id" AND "candidate_application"."deleted" IS NULL
        JOIN "job_listing" ON "candidate_application"."job_listing_id" = "job_listing"."id" AND "job_listing"."is_deleted" IS NOT TRUE
        JOIN "requisition" ON "job_listing"."job_requisition_id" = "requisition"."id" AND "requisition"."is_deleted" IS NOT TRUE
        JOIN "template_stage" ON "template_stage"."id" = stage_transitions."template_stage_id" AND "template_stage"."archived" IS NOT TRUE
        JOIN "template_milestone" ON "template_milestone"."id" = "template_stage"."template_milestone_id"
        WHERE stage_transitions."entered_at" IS NOT NULL
          {% if COMPILE_CONTEXT.securityContext.companyId %}
            AND "requisition"."company_id" = '{ COMPILE_CONTEXT.securityContext.companyId }'
          {% endif %}
        ORDER BY
          stage_transitions."candidate_application_id",
          stage_transitions."template_stage_id",
          stage_transitions."entered_at"
      )
      SELECT
        ut."candidate_application_id",
        ut."template_stage_id",
        ut."entered_at",
        ut."exited_at",
        nl."stage_label",
        ut."requisition_id",
        ut."job_name",
        ut."job_label",
        ut."company_id",
        nl."sort_order",
        COALESCE(ig.interview_count, 0) AS "interview_count",
        EXTRACT(EPOCH FROM (ut."exited_at" - ut."entered_at")) / 86400.0 AS "duration_days"
      FROM unique_transitions ut
      LEFT JOIN numbered_labels nl ON nl."stage_label_raw" = ut."stage_label_raw"
      LEFT JOIN interviews_grouped ig
        ON ig.application_id = ut."candidate_application_id"
        AND ig.stage_id = ut."template_stage_id"

    dimensions:
      - name: pk
        title: 'Primary Key'
        sql: "CONCAT({CUBE}.\"candidate_application_id\", '_', {CUBE}.\"template_stage_id\", '_', {CUBE}.\"entered_at\")"
        type: string
        primary_key: true
        public: false

      - name: stagelabel
        title: 'Stage Name'
        sql: 'stage_label'
        type: string

      - name: jobname
        title: 'Job Name'
        sql: 'job_name'
        type: string

      - name: joblabel
        title: 'Job Label'
        sql: 'job_label'
        type: string

      - name: enteredat
        title: 'Entered Stage At'
        sql: 'entered_at'
        type: time

      - name: companyid
        title: 'Company ID'
        sql: 'company_id'
        type: number

    measures:
      - name: candidatecount
        title: '# of Candidates'
        type: count_distinct
        sql: '{CUBE}."candidate_application_id"'

      - name: interviewsscheduled
        title: '# of Interviews Scheduled'
        type: sum
        sql: '{CUBE}."interview_count"'

      - name: avgdayscompleted
        title: 'Average Days in Stage'
        type: avg
        sql: '{CUBE}."duration_days"'
        filters:
          - sql: "{CUBE}.duration_days IS NOT NULL AND {CUBE}.duration_days >= 0"
