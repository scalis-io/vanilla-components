cubes:
  - name: custom_stage_time_analysis
    description: 'Custom report: Average time candidates spend in each pipeline stage (not just milestones), filterable by job label and date range. Aggregates by stage label across pipelines for sensible unfiltered default.'
    sql: >
      WITH stage_transitions AS (
        /* =====================================
           NORMAL STAGE TRANSITIONS
           ===================================== */
        SELECT
          "activity_log"."candidate_application_id",
          "activity_log"."new_template_stage_id" AS "template_stage_id",
          "activity_log"."activity_timestamp" AS "entered_at",
          LEAD("activity_log"."activity_timestamp") OVER (
            PARTITION BY "activity_log"."candidate_application_id"
            ORDER BY "activity_log"."activity_timestamp"
          ) AS "exited_at"
        FROM "activity_log"
        WHERE "activity_log"."user_action" = 'ADVANCE_CANDIDATE'
          AND "activity_log"."new_template_stage_id" IS NOT NULL
          AND "activity_log"."activity_timestamp" IS NOT NULL
          AND "activity_log"."is_deleted" IS NOT TRUE

        UNION ALL

        /* =====================================
           INITIAL STAGE (SOURCING VIA PREVIOUS STAGE)
           ===================================== */
        SELECT
          "activity_log"."candidate_application_id",
          "activity_log"."previous_template_stage_id" AS "template_stage_id",
          COALESCE(
            "candidate_application"."applied_at",
            "candidate_application"."created_at"
          ) AS "entered_at",
          "activity_log"."activity_timestamp" AS "exited_at"
        FROM "activity_log"
        JOIN "candidate_application"
          ON "candidate_application"."id" = "activity_log"."candidate_application_id"
          AND "candidate_application"."deleted" IS NULL
        WHERE "activity_log"."user_action" = 'ADVANCE_CANDIDATE'
          AND "activity_log"."previous_template_stage_id" IS NOT NULL
          AND "activity_log"."activity_timestamp" IS NOT NULL
          AND "activity_log"."is_deleted" IS NOT TRUE
          AND NOT EXISTS (
            SELECT 1
            FROM "activity_log" al2
            WHERE al2."candidate_application_id" = "activity_log"."candidate_application_id"
              AND al2."user_action" = 'ADVANCE_CANDIDATE'
              AND al2."activity_timestamp" < "activity_log"."activity_timestamp"
              AND al2."is_deleted" IS NOT TRUE
          )
      ),
      unique_transitions AS (
        SELECT DISTINCT ON (
          stage_transitions."candidate_application_id",
          stage_transitions."template_stage_id",
          stage_transitions."entered_at"
        )
          stage_transitions."candidate_application_id",
          stage_transitions."template_stage_id",
          stage_transitions."entered_at",
          stage_transitions."exited_at",
          "template_stage"."name"::text AS "stage_name",
          "template_stage"."pipeline_rank_order" AS "stage_rank_order",
          "template_milestone"."name"::text AS "milestone_name",
          "template_milestone"."rank_order" AS "milestone_rank_order",
          CASE
            WHEN "template_stage"."name" IS NULL OR TRIM("template_stage"."name"::text) = ''
              THEN INITCAP(REPLACE("template_milestone"."name"::text, '_', ' '))
            WHEN UPPER(REPLACE("template_stage"."name"::text, '_', ' ')) = UPPER(REPLACE("template_milestone"."name"::text, '_', ' '))
              THEN INITCAP(REPLACE("template_stage"."name"::text, '_', ' '))
            ELSE CONCAT(
              INITCAP(REPLACE("template_milestone"."name"::text, '_', ' ')),
              ' > ',
              INITCAP(REPLACE("template_stage"."name"::text, '_', ' '))
            )
          END AS "stage_label",
          "requisition"."id" AS "requisition_id",
          "requisition"."job_name" AS "job_name",
          CONCAT("requisition"."job_name", ' (Req ID: ', "requisition"."ext_requisition_id", ')') AS "job_label",
          "requisition"."company_id" AS "company_id"
        FROM stage_transitions
        JOIN "candidate_application"
          ON "candidate_application"."id" = stage_transitions."candidate_application_id"
          AND "candidate_application"."deleted" IS NULL
        JOIN "job_listing"
          ON "candidate_application"."job_listing_id" = "job_listing"."id"
          AND "job_listing"."is_deleted" IS NOT TRUE
        JOIN "requisition"
          ON "job_listing"."job_requisition_id" = "requisition"."id"
          AND "requisition"."is_deleted" IS NOT TRUE
        JOIN "template_stage"
          ON "template_stage"."id" = stage_transitions."template_stage_id"
          AND "template_stage"."archived" IS NOT TRUE
        JOIN "template_milestone"
          ON "template_milestone"."id" = "template_stage"."template_milestone_id"
          AND "template_milestone"."name"::text <> 'HIRED'
        WHERE stage_transitions."entered_at" IS NOT NULL
          {% if COMPILE_CONTEXT.securityContext.companyId %}
            AND "requisition"."company_id" = '{ COMPILE_CONTEXT.securityContext.companyId }'
          {% endif %}
        ORDER BY
          stage_transitions."candidate_application_id",
          stage_transitions."template_stage_id",
          stage_transitions."entered_at"
      ),
      /* Compute a single sort_order per stage_label across all pipelines */
      label_sort AS (
        SELECT
          ut."stage_label",
          MIN(ut."milestone_rank_order" * 1000 + ut."stage_rank_order") AS "sort_order"
        FROM unique_transitions ut
        GROUP BY ut."stage_label"
      )
      SELECT
        ut."candidate_application_id",
        ut."template_stage_id",
        ut."entered_at",
        ut."exited_at",
        ut."stage_name",
        ut."milestone_name",
        ut."milestone_rank_order",
        ut."stage_label",
        ut."requisition_id",
        ut."job_name",
        ut."job_label",
        ut."company_id",
        ls."sort_order"
      FROM unique_transitions ut
      JOIN label_sort ls ON ls."stage_label" = ut."stage_label"

    dimensions:
      - name: pk
        title: 'Primary Key'
        sql: "CONCAT({CUBE}.\"candidate_application_id\", '_', {CUBE}.\"template_stage_id\", '_', {CUBE}.\"entered_at\")"
        type: string
        primary_key: true
        public: false

      - name: stagename
        title: 'Stage Name'
        sql: 'stage_name'
        type: string

      - name: sortorder
        title: 'Sort Order'
        sql: 'sort_order'
        type: number

      - name: milestonename
        title: 'Milestone Name'
        sql: 'milestone_name'
        type: string

      - name: milestonerankorder
        title: 'Milestone Order'
        sql: 'milestone_rank_order'
        type: number

      - name: stagelabel
        title: 'Stage Label (Milestone > Stage)'
        sql: 'stage_label'
        type: string

      - name: jobname
        title: 'Job Name'
        sql: 'job_name'
        type: string

      - name: joblabel
        title: 'Job Label'
        sql: 'job_label'
        type: string

      - name: enteredat
        title: 'Entered Stage At'
        sql: 'entered_at'
        type: time

      - name: companyid
        title: 'Company ID'
        sql: 'company_id'
        type: number

    measures:
      - name: candidatecount
        title: 'Candidates in Stage'
        description: 'Number of distinct candidates who entered the stage'
        type: count_distinct
        sql: '{CUBE}."candidate_application_id"'

      - name: avgdayscompleted
        title: 'Average Days (Completed Only)'
        description: 'Average days in stage for candidates who exited the stage'
        type: avg
        sql: >
          CASE
            WHEN {CUBE}."exited_at" IS NOT NULL
                 AND {CUBE}."exited_at" >= {CUBE}."entered_at" THEN
              EXTRACT(EPOCH FROM (
                {CUBE}."exited_at" - {CUBE}."entered_at"
              )) / 86400
            ELSE NULL
          END

      - name: yieldratio
        title: 'Yield Ratio'
        description: 'Ratio of candidates who completed the stage vs total who entered (completed / entered) as percentage (0-100)'
        type: number
        sql: >
          CASE
            WHEN COUNT(DISTINCT CONCAT(
              {CUBE}."candidate_application_id"::TEXT,
              '-',
              {CUBE}."template_stage_id"::TEXT,
              '-',
              {CUBE}."entered_at"::TEXT
            )) > 0 THEN
              (COUNT(DISTINCT
                CASE
                  WHEN {CUBE}."exited_at" IS NOT NULL
                       AND {CUBE}."exited_at" >= {CUBE}."entered_at" THEN
                    CONCAT(
                      {CUBE}."candidate_application_id"::TEXT,
                      '-',
                      {CUBE}."template_stage_id"::TEXT,
                      '-',
                      {CUBE}."entered_at"::TEXT
                    )
                  ELSE NULL
                END
              )::FLOAT / COUNT(DISTINCT CONCAT(
                {CUBE}."candidate_application_id"::TEXT,
                '-',
                {CUBE}."template_stage_id"::TEXT,
                '-',
                {CUBE}."entered_at"::TEXT
              ))::FLOAT) * 100
            ELSE 0
          END
